name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 0
      VERSION: ${{ github.ref_name }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
            ext: ""
          - goos: linux
            goarch: arm64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            ext: ""
          - goos: windows
            goarch: amd64
            archive: zip
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Build
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-s -w -X github.com/leolaurindo/gixt/internal/version.Version=${VERSION}" \
            -o dist/gixt${{ matrix.ext }} ./cmd/gixt

      - name: Verify injected version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: test "$(dist/gixt --version)" = "gixt version ${VERSION}"

      - name: Package
        run: |
          cd dist
          NAME=gixt_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip ${NAME}.zip gixt${{ matrix.ext }}
          else
            tar -czf ${NAME}.tar.gz gixt${{ matrix.ext }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gixt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/gixt_*.*

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: gixt-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum gixt_* > checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2.0.1
        with:
          generate_release_notes: true
          files: |
            dist/gixt_*.*
            dist/checksums.txt
