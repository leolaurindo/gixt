name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      VERSION: ${{ github.ref_name }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
            ext: ""
          - goos: linux
            goarch: arm64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            ext: ""
          - goos: windows
            goarch: amd64
            archive: zip
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Build
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X github.com/leolaurindo/gixt/internal/version.Version=${VERSION}" \
            -o dist/gixt${{ matrix.ext }} ./cmd/gixt

      - name: Package
        run: |
          cd dist
          NAME=gixt_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip ${NAME}.zip gixt${{ matrix.ext }}
          else
            tar -czf ${NAME}.tar.gz gixt${{ matrix.ext }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: gixt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/gixt_*.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: gixt-*
          merge-multiple: true
          path: dist

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { release = 1; next }
            release && /^## \[/ { exit }
            release { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Generate checksums
        working-directory: dist
        run: sha256sum gixt_* > checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2.0.1
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/gixt_*.*
            dist/checksums.txt
